# Generates the images shown in README.md (growing contribution snake, stats and
# top-languages cards) and pushes them to the `output` branch.
name: Generate profile images

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (07:00 Bangkok)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the v1 commit (reviewed): grows one segment per contribution cell it eats.
      - uses: dahan8473/snake-and-commits@c55d1f1668e849195f395a9d93c56e74b68aaac2 # v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake.svg
          theme: blue
          frame: "true"

      - name: Render stats and language cards
        run: python3 scripts/profile_stats.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
