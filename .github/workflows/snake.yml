# Generates the growing contribution snake shown in README.md and pushes it to the `output` branch.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (07:00 Bangkok)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to the v1 commit (reviewed): grows one segment per contribution cell it eats.
      - uses: dahan8473/snake-and-commits@c55d1f1668e849195f395a9d93c56e74b68aaac2 # v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake.svg
          theme: blue
          frame: "true"

      - name: Push the snake to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
